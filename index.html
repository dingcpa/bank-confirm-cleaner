<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>銀行電子函證清洗工具</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Microsoft JhengHei', 'Segoe UI', sans-serif; background: #f0f2f5; color: #333; }

.container { max-width: 1400px; margin: 0 auto; padding: 20px; }

h1 { text-align: center; margin: 20px 0; font-size: 28px; color: #1a365d; }

/* 上傳區 */
.upload-section {
  background: #fff; border-radius: 12px; padding: 30px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px;
}
.drop-zone {
  border: 2px dashed #a0aec0; border-radius: 8px; padding: 40px;
  text-align: center; cursor: pointer; transition: all 0.2s;
  background: #fafbfc;
}
.drop-zone:hover, .drop-zone.drag-over {
  border-color: #3182ce; background: #ebf8ff;
}
.drop-zone p { font-size: 16px; color: #718096; margin-bottom: 8px; }
.drop-zone .hint { font-size: 13px; color: #a0aec0; }
.drop-zone input[type="file"] { display: none; }

/* 檔案列表 */
.file-list {
  margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px;
}
.file-tag {
  display: inline-flex; align-items: center; gap: 6px;
  background: #edf2f7; border-radius: 6px; padding: 6px 12px;
  font-size: 13px;
}
.file-tag .remove {
  cursor: pointer; color: #e53e3e; font-weight: bold;
  font-size: 16px; line-height: 1;
}

/* 按鈕 */
.actions { display: flex; gap: 12px; margin-top: 16px; }
.btn {
  padding: 10px 28px; border: none; border-radius: 8px; font-size: 15px;
  cursor: pointer; font-weight: 600; transition: all 0.2s;
}
.btn-primary { background: #3182ce; color: #fff; }
.btn-primary:hover { background: #2b6cb0; }
.btn-primary:disabled { background: #a0aec0; cursor: not-allowed; }
.btn-success { background: #38a169; color: #fff; }
.btn-success:hover { background: #2f855a; }
.btn-danger { background: #e53e3e; color: #fff; }
.btn-danger:hover { background: #c53030; }

/* 狀態訊息 */
.status { margin-top: 12px; font-size: 14px; }
.status.error { color: #e53e3e; }
.status.success { color: #38a169; }

/* 預覽區 */
.preview-section {
  background: #fff; border-radius: 12px; padding: 24px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-top: 20px;
}
.tabs {
  display: flex; gap: 0; margin-bottom: 16px; border-bottom: 2px solid #e2e8f0;
}
.tab {
  padding: 10px 24px; cursor: pointer; font-size: 15px; font-weight: 600;
  color: #718096; border-bottom: 3px solid transparent;
  margin-bottom: -2px; transition: all 0.2s;
}
.tab.active { color: #3182ce; border-bottom-color: #3182ce; }
.tab:hover { color: #2b6cb0; }

.tab-content { display: none; }
.tab-content.active { display: block; }

/* 表格 */
.table-wrap { overflow-x: auto; }
table {
  width: 100%; border-collapse: collapse; font-size: 13px;
  min-width: 900px;
}
th {
  background: #2d3748; color: #fff; padding: 10px 8px;
  text-align: center; white-space: nowrap; position: sticky; top: 0;
}
td {
  padding: 8px; border: 1px solid #e2e8f0; vertical-align: middle;
}
tr:nth-child(even) { background: #f7fafc; }
tr:hover { background: #ebf8ff; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
td.center { text-align: center; }

/* 匯率輸入 */
input.rate-input {
  width: 70px; padding: 4px 6px; border: 1px solid #cbd5e0;
  border-radius: 4px; text-align: right; font-size: 13px;
}
input.rate-input:focus { outline: none; border-color: #3182ce; }

/* 合計列 */
tr.total-row { font-weight: bold; background: #edf2f7 !important; }
tr.total-row td { border-top: 2px solid #2d3748; }
tr.subtotal-row { font-weight: bold; background: #e2eaf5 !important; }
tr.subtotal-row td { border-top: 1px solid #718096; color: #2d3748; }

/* 借款分類欄（可摺疊）*/
table.classify-hidden .classify-col { display: none; }
.classify-toggle {
  cursor: pointer; color: #3182ce; font-size: 13px;
  border: 1px solid #3182ce; border-radius: 4px; padding: 3px 10px;
  font-weight: 600; user-select: none; display: inline-block;
}
.classify-toggle:hover { background: #ebf8ff; }

/* 空狀態 */
.empty-state { text-align: center; padding: 40px; color: #a0aec0; font-size: 15px; }

/* Loading */
.loading { display: inline-block; width: 18px; height: 18px;
  border: 3px solid #a0aec0; border-top-color: #3182ce;
  border-radius: 50%; animation: spin 0.8s linear infinite;
  vertical-align: middle; margin-right: 8px;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="container">
  <h1>銀行電子函證清洗工具</h1>

  <div class="upload-section">
    <div class="drop-zone" id="dropZone">
      <p>將銀行電子函證回覆檔案拖曳至此，或點擊選擇檔案</p>
      <div class="hint">支援 .xlsx 格式，可同時上傳多個檔案</div>
      <input type="file" id="fileInput" accept=".xlsx" multiple>
    </div>
    <div class="file-list" id="fileList"></div>
    <div class="actions">
      <button class="btn btn-primary" id="btnClean" disabled>清洗</button>
      <button class="btn btn-danger" id="btnClear" style="display:none">清除全部</button>
      <button class="btn btn-success" id="btnDownload" style="display:none">下載 Excel</button>
    </div>
    <div class="status" id="status"></div>
  </div>

  <div class="preview-section" id="previewSection" style="display:none">
    <div class="tabs">
      <div class="tab active" data-tab="deposits">銀行存款明細表</div>
      <div class="tab" data-tab="loans">銀行借款明細表</div>
      <div class="tab" data-tab="other" id="tab-btn-other" style="display:none">其他項目彙總表</div>
    </div>
    <div class="tab-content active" id="tab-deposits">
      <div class="table-wrap" id="depositTable"></div>
    </div>
    <div class="tab-content" id="tab-loans">
      <div class="table-wrap" id="loanTable"></div>
    </div>
    <div class="tab-content" id="tab-other">
      <div id="otherTable"></div>
    </div>
  </div>
</div>

<footer style="text-align:center;padding:24px 0 16px;font-size:12px;color:#a0aec0">
  © 勤美聯合會計師事務所　保留所有權利
</footer>

<!-- SheetJS：讀取 xlsx；ExcelJS：寫出帶樣式的 xlsx -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script>
// ════════════════════════════════════════════════
// DOM 參照
// ════════════════════════════════════════════════
const fileInput     = document.getElementById('fileInput');
const dropZone      = document.getElementById('dropZone');
const fileList      = document.getElementById('fileList');
const btnClean      = document.getElementById('btnClean');
const btnClear      = document.getElementById('btnClear');
const btnDownload   = document.getElementById('btnDownload');
const statusEl      = document.getElementById('status');
const previewSection = document.getElementById('previewSection');

let uploadedFiles = [];
let cleanedData   = null;
let _depBankGroups = [];

// ════════════════════════════════════════════════
// 拖曳 / 選檔上傳
// ════════════════════════════════════════════════
dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  addFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', () => { addFiles(fileInput.files); fileInput.value = ''; });

function addFiles(fileListObj) {
  for (const f of fileListObj) {
    if (!f.name.endsWith('.xlsx')) continue;
    if (uploadedFiles.some(uf => uf.name === f.name)) continue;
    uploadedFiles.push(f);
  }
  renderFileList();
}

function renderFileList() {
  fileList.innerHTML = uploadedFiles.map((f, i) =>
    `<div class="file-tag">
      <span>${f.name}</span>
      <span class="remove" data-idx="${i}">&times;</span>
    </div>`
  ).join('');
  fileList.querySelectorAll('.remove').forEach(el => {
    el.addEventListener('click', () => {
      uploadedFiles.splice(parseInt(el.dataset.idx), 1);
      renderFileList();
    });
  });
  btnClean.disabled = uploadedFiles.length === 0;
  btnClear.style.display = uploadedFiles.length > 0 ? '' : 'none';
}

btnClear.addEventListener('click', () => {
  uploadedFiles = [];
  cleanedData   = null;
  renderFileList();
  previewSection.style.display = 'none';
  btnDownload.style.display    = 'none';
  statusEl.textContent = '';
  statusEl.className   = 'status';
});

// ════════════════════════════════════════════════
// 工具函數
// ════════════════════════════════════════════════
function cleanValue(v) {
  if (v === null || v === undefined) return '';
  if (v instanceof Date) {
    const y = v.getFullYear();
    const m = String(v.getMonth() + 1).padStart(2, '0');
    const d = String(v.getDate()).padStart(2, '0');
    return `${y}/${m}/${d}`;
  }
  return String(v).trim().replace(/\u00a0/g, '').replace(/&nbsp;/g, '');
}

function normalizeCurrency(c) {
  const s = cleanValue(c).toUpperCase();
  if (['NTD','NT','TWD','台幣','臺幣','新台幣','新臺幣'].includes(s)) return 'TWD';
  return s;
}

function toRocDate(val) {
  const s = cleanValue(val);
  if (!s || s === '無') return '';
  const m = s.match(/^(\d{4})[/\-.](\d{1,2})[/\-.](\d{1,2})$/);
  if (m) {
    const y = parseInt(m[1]), mo = parseInt(m[2]), d = parseInt(m[3]);
    return (y - 1911) * 10000 + mo * 100 + d;
  }
  if (/^\d{7}$/.test(s)) return parseInt(s);
  // 8 碼西元日期 YYYYMMDD（如 20260421）
  if (/^\d{8}$/.test(s)) {
    const y = parseInt(s.substring(0, 4));
    const mo = parseInt(s.substring(4, 6));
    const d = parseInt(s.substring(6, 8));
    if (y > 1911) return (y - 1911) * 10000 + mo * 100 + d;
  }
  return s;
}

function formatRocDate(val) {
  if (!val && val !== 0) return '';
  const n = typeof val === 'number' ? val : parseInt(val);
  if (isNaN(n) || n < 1000000) return val || '';
  const roc = Math.floor(n / 10000);
  const m   = String(Math.floor((n % 10000) / 100)).padStart(2, '0');
  const d   = String(n % 100).padStart(2, '0');
  return `${roc}/${m}/${d}`;
}

function normYN(val) {
  const v = (val || '').trim();
  if (['Y','y','有'].includes(v)) return '有';
  if (['N','n','無',''].includes(v)) return '';
  return v;
}

function hasData(v) {
  if (!v || v === '無') return false;
  const n = parseFloat(v);
  if (!isNaN(n)) return n !== 0;
  return !/^[A-Z]{2,4}$/.test(v);
}

function formatNumber(n, decimals) {
  if (n === '' || n === null || n === undefined) return '';
  const opts = decimals != null ? { minimumFractionDigits: decimals, maximumFractionDigits: decimals } : {};
  return Number(n).toLocaleString('zh-TW', opts);
}

// ════════════════════════════════════════════════
// 台灣銀行匯率查詢（透過 CORS proxy）
// ════════════════════════════════════════════════
function parseBoTRates(html) {
  const doc = (new DOMParser()).parseFromString(html, 'text/html');
  const rates = {};
  doc.querySelectorAll('tbody tr').forEach(row => {
    let currency = '', buy = 0, sell = 0;
    row.querySelectorAll('td').forEach(cell => {
      const label = cell.getAttribute('data-table') || '';
      const text  = cell.textContent.trim();
      if (label === '幣別') {
        const m = text.match(/\((\w+)\)/);
        if (m) currency = m[1];
      } else if (label === '本行即期買入') {
        buy = parseFloat(text) || 0;
      } else if (label === '本行即期賣出') {
        sell = parseFloat(text) || 0;
      }
    });
    if (currency && buy > 0 && sell > 0) {
      rates[currency] = { buy, sell, avg: Math.round((buy + sell) / 2 * 10000) / 10000 };
    }
  });
  return rates;
}

function localDateStr(d) {
  // 使用本地時區格式化為 'YYYY-MM-DD'，避免 toISOString() 時區偏移問題
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

async function fetchBoTRatesForDate(dateStr) {
  // dateStr: 'YYYY-MM-DD'，回傳 rates 或 null（無資料）
  const url = `https://rate.bot.com.tw/xrt/all/${dateStr}?Lang=zh-TW`;
  const proxies = [
    { target: url,                                                          isJson: false },
    { target: `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`, isJson: true  },
    { target: `https://corsproxy.io/?${encodeURIComponent(url)}`,           isJson: false },
  ];
  for (const { target, isJson } of proxies) {
    try {
      const resp = await fetch(target);
      if (!resp.ok) continue;
      const html  = isJson ? (await resp.json()).contents : await resp.text();
      const rates = parseBoTRates(html);
      if (Object.keys(rates).length > 0) return rates;
    } catch (_) { /* 繼續嘗試下一個 proxy */ }
  }
  return null;
}

async function fetchBoTRates(dateStr) {
  // 從基準日起，最多往前找 7 個自然日，直到找到有資料的營業日
  const parts = dateStr.replace(/\//g, '-').split('-');
  // 用本地日期建構，避免時區問題
  let d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
  for (let i = 0; i < 7; i++) {
    const s     = localDateStr(d);
    const rates = await fetchBoTRatesForDate(s);
    if (rates) return { rates, dateUsed: s };
    d.setDate(d.getDate() - 1);
  }
  throw new Error('近 7 日均無匯率資料，請手動輸入');
}

// ── 套用匯率至 UI（共用邏輯）──
function applyRatesToUI(allRates, dateUsed) {
  const foreignCurrencies = new Set([
    ...cleanedData.deposits.filter(d => d.currency !== 'TWD').map(d => d.currency),
    ...cleanedData.loans.filter(l => l.currency !== 'TWD').map(l => l.currency),
  ]);
  let updated = 0;
  cleanedData.deposits.forEach((dep, idx) => {
    if (dep.currency !== 'TWD' && allRates[dep.currency]) {
      const rate = allRates[dep.currency].avg;
      dep.rate   = rate;
      const input = document.querySelector(`.rate-input[data-idx="${idx}"]`);
      if (input) {
        input.value = rate;
        document.getElementById(`dep-twd-${idx}`).textContent =
          formatNumber(Math.round(dep.amount * rate));
      }
      updated++;
    }
  });
  // 填入借款外幣匯率
  cleanedData.loans.forEach(loan => {
    if (loan.currency !== 'TWD' && allRates[loan.currency]) {
      loan.fx_rate = allRates[loan.currency].avg;
      updated++;
    }
  });
  recalcDepositTotal();
  renderLoanTable();

  const rateDetails = {};
  for (const cur of foreignCurrencies) {
    if (allRates[cur]) rateDetails[cur] = allRates[cur];
  }
  cleanedData.rate_details = rateDetails;
  const [ry, rm, rd2] = dateUsed.split('-').map(Number);
  cleanedData.rate_note =
    `外幣匯率係依台灣銀行${ry - 1911}年${rm}月${rd2}日即期買入及賣出之平均匯率為基準`;

  const statusSpan = document.getElementById('rateStatus');
  if (statusSpan) {
    const baseDateStr = (cleanedData.base_date || '').replace(/\//g, '-');
    const dateNote    = dateUsed !== baseDateStr ? `（${dateUsed}）` : '';
    statusSpan.style.color = '#38a169';
    statusSpan.textContent = `已填入 ${updated} 筆匯率${dateNote}`;
  }
  renderRateTable();
}

// ── 手動按鈕：即時查詢 ──
async function handleFetchRates() {
  const btn        = document.getElementById('btnFetchRates');
  const statusSpan = document.getElementById('rateStatus');
  if (btn) btn.disabled = true;
  if (statusSpan) { statusSpan.style.color = '#718096'; statusSpan.textContent = '查詢中...'; }

  try {
    const { rates, dateUsed } = await fetchBoTRates(cleanedData.base_date);
    applyRatesToUI(rates, dateUsed);
  } catch (err) {
    if (statusSpan) { statusSpan.style.color = '#e53e3e'; statusSpan.textContent = err.message; }
  } finally {
    if (btn) btn.disabled = false;
  }
}

// ── 頁面載入時預取上一年度年末匯率 ──
const PREFETCH_CE_YEAR = new Date().getFullYear() - 1; // e.g., 2025（民國114年）
const yearEndRatesPromise = (async () => {
  try {
    const result = await fetchBoTRates(`${PREFETCH_CE_YEAR}/12/31`);
    return result; // { rates, dateUsed }
  } catch (_) {
    return null;
  }
})();

function renderRateTable() {
  const container = document.getElementById('rateTableContainer');
  if (!container) return;
  const rd = cleanedData.rate_details || {};
  if (!Object.keys(rd).length) { container.innerHTML = ''; return; }

  let html = `<p style="margin-top:10px;color:#718096;font-size:13px;font-style:italic">
    ${cleanedData.rate_note || ''}</p>
    <table style="margin-top:8px;border-collapse:collapse;font-size:13px">
    <thead><tr>
      <th style="background:#4a5568;color:#fff;padding:6px 14px;border:1px solid #cbd5e0">幣別</th>
      <th style="background:#4a5568;color:#fff;padding:6px 14px;border:1px solid #cbd5e0">即期買入</th>
      <th style="background:#4a5568;color:#fff;padding:6px 14px;border:1px solid #cbd5e0">即期賣出</th>
      <th style="background:#4a5568;color:#fff;padding:6px 14px;border:1px solid #cbd5e0">平均匯率</th>
    </tr></thead><tbody>`;
  for (const [cur, d] of Object.entries(rd)) {
    html += `<tr>
      <td style="padding:5px 14px;border:1px solid #e2e8f0;text-align:center">${cur}</td>
      <td style="padding:5px 14px;border:1px solid #e2e8f0;text-align:right">${d.buy}</td>
      <td style="padding:5px 14px;border:1px solid #e2e8f0;text-align:right">${d.sell}</td>
      <td style="padding:5px 14px;border:1px solid #e2e8f0;text-align:right;font-weight:600">${d.avg}</td>
    </tr>`;
  }
  html += '</tbody></table>';
  container.innerHTML = html;
}

// ════════════════════════════════════════════════
// 解析單一銀行函證 xlsx（使用 SheetJS）
// ════════════════════════════════════════════════
function parseConfirmation(arrayBuffer, filename) {
  const wb = XLSX.read(new Uint8Array(arrayBuffer), { type: 'array', cellDates: true });
  const ws = wb.Sheets[wb.SheetNames[0]];

  const rng    = XLSX.utils.decode_range(ws['!ref'] || 'A1');
  const maxRow = rng.e.r + 1; // 1-indexed
  const maxCol = rng.e.c + 1;

  // 讀取儲存格（1-indexed，同 openpyxl）
  function cell(r, c) {
    const ref = XLSX.utils.encode_cell({ r: r - 1, c: c - 1 });
    const cv  = ws[ref];
    if (!cv || cv.v === undefined) return null;
    if (cv.v instanceof Date) return cleanValue(cv.v);
    return cv.v;
  }

  // 表頭
  const companyId   = cleanValue(cell(4, 2));
  const companyName = cleanValue(cell(4, 4));
  const bankFull    = cleanValue(cell(5, 4));
  const branchName  = cleanValue(cell(5, 8));
  const baseDate    = cleanValue(cell(6, 2));
  const bankLabel   = branchName || bankFull;

  // 找各 section 起始列
  let depositStart = null, loanStart = null, loanEnd = null;
  for (let r = 1; r <= maxRow; r++) {
    const a = cleanValue(cell(r, 1));
    if (a.startsWith('1.存款'))       depositStart = r;
    else if (a.startsWith('2.貼現及放款')) loanStart = r;
    else if (a.startsWith('3.應收帳款')) loanEnd   = r;
  }

  // === 存款 ===
  const deposits = [];
  if (depositStart) {
    const end = loanStart || maxRow;
    for (let r = depositStart + 2; r < end; r++) {
      const a = cleanValue(cell(r, 1));
      const b = cleanValue(cell(r, 2));
      const c = cleanValue(cell(r, 3));
      const d = cell(r, 4);
      const e = cleanValue(cell(r, 5));
      const f = cleanValue(cell(r, 6));
      const gRaw = cell(r, 7);
      const g = gRaw instanceof Date ? toRocDate(gRaw) : cleanValue(gRaw);
      const hRaw = cleanValue(cell(r, 8));

      if (!a || a.includes('合計')) continue;

      const hasAccount = b && b !== '無';
      const hasBalance = typeof d === 'number' && d !== 0;
      if (!hasAccount && !hasBalance) continue;

      const currency = normalizeCurrency(c);
      if (!currency) continue;

      let restriction = '';
      const hasRestrict = (e === '有' || e === 'Y' || e === 'y');
      const descIsReal = f && !['無', 'N', 'n', 'Y', 'y', '有'].includes(f);
      if (hasRestrict && descIsReal) restriction = f;
      else if (hasRestrict) restriction = '有';

      const dueDate      = (g && g !== '無') ? String(g).trim() : '';
      const interestRate = (hRaw && hRaw !== '無') ? String(hRaw).trim() : '';

      // 定存自動把到期日 / 年利率寫入備註，供使用者辨識同一帳號下的多筆定存
      let autoNote = '';
      if (a.includes('定期存款') || a.includes('定存')) {
        const parts = [];
        if (dueDate)      parts.push(`到期日 ${dueDate}`);
        if (interestRate) parts.push(`利率 ${interestRate}%`);
        autoNote = parts.join('｜');
      }

      deposits.push({
        bank: bankLabel,
        type: a,
        account: b ? b.trim() : '',
        currency,
        amount: typeof d === 'number' ? d : 0,
        rate: currency === 'TWD' ? 1 : '',
        due_date: dueDate,
        interest_rate: interestRate,
        restriction,
        note: autoNote,
      });
    }
  }

  // === 放款 ===
  const loans = [];
  if (loanStart) {
    const end = loanEnd || maxRow;
    for (let r = loanStart + 2; r < end; r++) {
      const a    = cleanValue(cell(r, 1));
      const b    = cleanValue(cell(r, 2));
      const c    = cleanValue(cell(r, 3));
      const d    = cell(r, 4);
      const e    = cleanValue(cell(r, 5));
      const f    = cleanValue(cell(r, 6));
      const h    = cell(r, 8);
      const iv   = cell(r, 9);
      const j    = cleanValue(cell(r, 10));
      const mVal = cleanValue(cell(r, 13));

      if (!a || a.includes('合計')) continue;

      const hasBalance = typeof d === 'number';
      const hasAccount = b && b !== '無';
      if (!hasBalance && !hasAccount) continue;

      const loanCurrency = normalizeCurrency(c);
      loans.push({
        bank:            bankLabel,
        type:            a,
        account:         (b && b !== '無') ? b.trim() : '',
        loan_date:       toRocDate(cleanValue(h)),
        due_date:        toRocDate(cleanValue(iv)),
        currency:        loanCurrency,
        amount:          typeof d === 'number' ? d : 0,
        fx_rate:         loanCurrency === 'TWD' ? 1 : '',
        interest_rate:   (j && j !== '無') ? j : '',
        guarantor:       normYN(e),
        collateral:      normYN(f),
        collateral_desc: (mVal && mVal !== '無') ? mVal : '',
        note:            '',
      });
    }
  }

  // === Section 3-10（其他項目）===
  const otherSections = [];
  if (loanEnd) {
    let currentSec  = null;
    let headerParsed = false;

    for (let r = loanEnd; r <= maxRow; r++) {
      const a = cleanValue(cell(r, 1));

      if (/^\d+\./.test(a)) {
        if (currentSec && currentSec.rows.length) otherSections.push(currentSec);
        currentSec  = { title: a, bank: bankLabel, headers: [], rows: [] };
        headerParsed = false;
      } else if (currentSec !== null) {
        if (!headerParsed) {
          const hdrs = [];
          for (let c = 1; c <= maxCol; c++) {
            const v = cleanValue(cell(r, c));
            if (v) hdrs.push(v); else break;
          }
          currentSec.headers = hdrs;
          headerParsed = true;
        } else {
          const nCols = currentSec.headers.length;
          const vals  = [];
          for (let c = 1; c <= nCols; c++) vals.push(cleanValue(cell(r, c)));
          if (vals.slice(1).some(v => hasData(v))) currentSec.rows.push(vals);
        }
      }
    }
    if (currentSec && currentSec.rows.length) otherSections.push(currentSec);
  }

  return {
    company_id: companyId, company_name: companyName,
    bank: bankLabel, base_date: baseDate,
    deposits, loans, other_sections: otherSections, filename,
  };
}

// ════════════════════════════════════════════════
// 合併多份檔案結果 & 去重
// ════════════════════════════════════════════════
function mergeAndDedup(results) {
  const companyIds = new Set(results.map(r => r.company_id).filter(Boolean));
  if (companyIds.size > 1) {
    const names = [...new Set(results.map(r => r.company_name))];
    throw new Error(`上傳的檔案包含不同公司：${names.join('、')}。請確保所有檔案屬於同一家公司。`);
  }

  let allDeposits = [], allLoans = [];
  let companyName = '', companyId = '', baseDate = '';
  const allOther = [], seenOther = new Set();

  for (const result of results) {
    allDeposits.push(...result.deposits);
    allLoans.push(...result.loans);
    if (!companyName) {
      companyName = result.company_name;
      companyId   = result.company_id;
      baseDate    = result.base_date;
    }
    for (const sec of (result.other_sections || [])) {
      for (const row of sec.rows) {
        const key = JSON.stringify([sec.bank, sec.title, row]);
        if (!seenOther.has(key)) {
          seenOther.add(key);
          const existing = allOther.find(s => s.title === sec.title && s.bank === sec.bank);
          if (existing) existing.rows.push(row);
          else allOther.push({ title: sec.title, bank: sec.bank, headers: sec.headers, rows: [row] });
        }
      }
    }
  }

  const dedup = (items, keyFn) => {
    const seen = new Set();
    return items.filter(item => {
      const k = keyFn(item);
      if (seen.has(k)) return false;
      seen.add(k); return true;
    });
  };

  // 同一帳號同金額的多筆定存以「到期日+利率」區分，避免被誤合併為一筆
  allDeposits = dedup(allDeposits, d => JSON.stringify([d.bank, d.account, d.currency, d.amount, d.due_date || '', d.interest_rate || '']));
  allLoans    = dedup(allLoans,    l => JSON.stringify([l.bank, l.account, l.currency, l.amount, l.loan_date, l.due_date]));

  return {
    company_name: companyName, company_id: companyId, base_date: baseDate,
    deposits: allDeposits, loans: allLoans, other_sections: allOther,
    rate_note: '', rate_details: {}, errors: [], file_count: results.length,
  };
}

// ════════════════════════════════════════════════
// 產生輸出 xlsx（使用 ExcelJS，含完整樣式）
// ════════════════════════════════════════════════
async function generateXlsx(data) {
  const wb = new ExcelJS.Workbook();

  // 顏色
  const C = { TITLE:'1A365D', HEADER:'2D3748', CALC:'4A5568', TOTAL:'EDF2F7', EVEN:'F7FAFC', ODD:'FFFFFF', RATE:'EBF8FF' };
  const fill  = hex => ({ type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF' + hex } });
  const THIN  = { style: 'thin',   color: { argb: 'FFC0C8D8' } };
  const MED   = { style: 'medium', color: { argb: 'FF2D3748' } };
  const bThin  = () => ({ top: THIN, left: THIN, bottom: THIN, right: THIN });
  const bTotal = () => ({ top: MED,  left: THIN, bottom: THIN, right: THIN });

  const aCenter = { horizontal: 'center', vertical: 'middle' };
  const aLeft   = { horizontal: 'left',   vertical: 'middle' };
  const aRight  = { horizontal: 'right',  vertical: 'middle' };
  const aWrap   = { horizontal: 'center', vertical: 'middle', wrapText: true };

  const fTitle  = (sz=14) => ({ bold:true, color:{argb:'FFFFFFFF'}, name:'Microsoft JhengHei', size:sz });
  const fHeader = ()       => ({ bold:true, color:{argb:'FFFFFFFF'}, name:'Microsoft JhengHei', size:11 });
  const fTotal  = ()       => ({ bold:true, name:'Microsoft JhengHei', size:11 });
  const fData   = ()       => ({ name:'Microsoft JhengHei', size:10 });

  function styleDataRow(ws, ri, nCols, numCols, centerCols) {
    const rowFill = fill(ri % 2 === 0 ? C.EVEN : C.ODD);
    for (let ci = 1; ci <= nCols; ci++) {
      const c = ws.getCell(ri, ci);
      c.fill   = rowFill;
      c.border = bThin();
      c.font   = fData();
      if (centerCols && centerCols.includes(ci)) c.alignment = aCenter;
      else if (numCols && numCols.includes(ci))  c.alignment = aRight;
      else                                        c.alignment = aLeft;
    }
  }

  const companyName = data.company_name || '';
  const baseDate    = data.base_date    || '';
  let rocDateStr    = baseDate;
  const dm = baseDate.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/);
  if (dm) rocDateStr = `中華民國${parseInt(dm[1]) - 1911}年${parseInt(dm[2])}月${parseInt(dm[3])}日`;

  // ── Sheet 1: 銀行存款 ──
  const ws1 = wb.addWorksheet('銀行存款');
  ws1.views = [{ showGridLines: false }];
  const N1 = 10;

  function titleRows(ws, N) {
    ws.mergeCells(1, 1, 1, N);
    Object.assign(ws.getCell(1,1), { value: companyName,      font: fTitle(15), fill: fill(C.TITLE), alignment: aCenter });
    ws.getRow(1).height = 28;
    ws.mergeCells(2, 1, 2, N);
    Object.assign(ws.getCell(2,1), { value: ws === ws1 ? '銀行存款明細表' : '銀行借款明細表', font: fTitle(13), fill: fill(C.TITLE), alignment: aCenter });
    ws.getRow(2).height = 22;
    ws.mergeCells(3, 1, 3, N);
    Object.assign(ws.getCell(3,1), { value: rocDateStr, font: { color:{argb:'FFFFFFFF'}, name:'Microsoft JhengHei', size:10, italic:true }, fill: fill(C.TITLE), alignment: aCenter });
    ws.getRow(3).height = 17;
    ws.getRow(4).height = 6;
  }

  titleRows(ws1, N1);

  // 欄標題 Row 5–6（系統計算分兩列）
  ['銀行別','存款別','帳號','幣別','回函原幣數','系統計算','','帳列數','限制情形','備註']
    .forEach((h, i) => {
      const c = ws1.getCell(5, i + 1);
      const isCalc = (i + 1 === 6 || i + 1 === 7);
      c.value = h; c.font = fHeader(); c.fill = fill(isCalc ? C.CALC : C.HEADER); c.border = bThin(); c.alignment = aWrap;
    });
  ws1.mergeCells(5, 6, 5, 7);  // 系統計算
  ['','','','','','匯率','換算台幣數','','',''].forEach((h, i) => {
    const c = ws1.getCell(6, i + 1);
    const isCalc = (i + 1 === 6 || i + 1 === 7);
    c.value = h; c.font = fHeader(); c.fill = fill(isCalc ? C.CALC : C.HEADER); c.border = bThin(); c.alignment = aWrap;
  });
  // 非合併欄跨 Row 5–6
  [1,2,3,4,5,8,9,10].forEach(ci => ws1.mergeCells(5, ci, 6, ci));
  ws1.getRow(5).height = 20;
  ws1.getRow(6).height = 30;
  [20,12,20,8,14,8,14,10,14,16].forEach((w, i) => { ws1.getColumn(i+1).width = w; });

  const deposits = data.deposits || [];

  // Group deposits by bank
  const depGroups1 = [];
  let _curBk1 = null;
  deposits.forEach((dep, i) => {
    if (dep.bank !== _curBk1) { depGroups1.push({ bank: dep.bank, indices: [] }); _curBk1 = dep.bank; }
    depGroups1[depGroups1.length - 1].indices.push(i);
  });

  const C_SUB = 'D6E4F0';
  const depRowMap = {};   // depositIdx → Excel row
  const depSubRows = [];  // subtotal row numbers
  let ri1 = 7;
  deposits.forEach((dep, idx) => {
    depRowMap[idx] = ri1;
    styleDataRow(ws1, ri1, N1, [5,6,7], [4,8]);
    const rate = dep.rate !== '' && dep.rate !== undefined ? Number(dep.rate) : 0;

    ws1.getCell(ri1,1).value = dep.bank;
    ws1.getCell(ri1,2).value = dep.type;
    ws1.getCell(ri1,3).value = dep.account;
    ws1.getCell(ri1,4).value = dep.currency;
    ws1.getCell(ri1,5).value = dep.amount;    ws1.getCell(ri1,5).numFmt = '#,##0';
    if (dep.rate !== '') ws1.getCell(ri1,6).value = rate;
    ws1.getCell(ri1,7).value = { formula: `ROUND(E${ri1}*F${ri1},0)` };
    ws1.getCell(ri1,7).numFmt = '#,##0';
    ws1.getCell(ri1,8).value = '';
    ws1.getCell(ri1,9).value = dep.restriction || '';
    ws1.getCell(ri1,10).value = dep.note || '';
    ri1++;

    // Bank subtotal row (only when multiple banks)
    if (depGroups1.length > 1) {
      const grp = depGroups1.find(g => g.indices[g.indices.length - 1] === idx);
      if (grp) {
        const firstRow = depRowMap[grp.indices[0]];
        const lastRow  = depRowMap[grp.indices[grp.indices.length - 1]];
        ws1.mergeCells(ri1, 1, ri1, 6);
        for (let ci = 1; ci <= N1; ci++) {
          const c = ws1.getCell(ri1, ci);
          c.fill = fill(C_SUB); c.border = bThin(); c.font = { ...fData(), bold: true };
        }
        ws1.getCell(ri1,1).value = `${grp.bank} 小計`;
        ws1.getCell(ri1,1).alignment = aLeft;
        ws1.getCell(ri1,7).value = { formula: `SUM(G${firstRow}:G${lastRow})` };
        ws1.getCell(ri1,7).numFmt = '#,##0'; ws1.getCell(ri1,7).alignment = aRight;
        ws1.getRow(ri1).height = 18;
        depSubRows.push(ri1);
        ri1++;
      }
    }
  });

  const tr1 = ri1;
  for (let ci = 1; ci <= N1; ci++) { const c = ws1.getCell(tr1,ci); c.fill=fill(C.TOTAL); c.border=bTotal(); c.font=fTotal(); }
  Object.assign(ws1.getCell(tr1,1), { value:'銀行存款合計', alignment:aLeft });
  // 合計公式：有小計就加小計，否則加全部資料列
  if (depSubRows.length > 0) {
    ws1.getCell(tr1,7).value = { formula: depSubRows.map(r => `G${r}`).join('+') };
  } else if (deposits.length > 0) {
    ws1.getCell(tr1,7).value = { formula: `SUM(G${depRowMap[0]}:G${depRowMap[deposits.length - 1]})` };
  } else {
    ws1.getCell(tr1,7).value = 0;
  }
  Object.assign(ws1.getCell(tr1,7), { numFmt:'#,##0', alignment:aRight });
  ws1.getRow(tr1).height = 20;

  // 匯率明細（若有）
  const rateNote    = data.rate_note    || '';
  const rateDetails = data.rate_details || {};
  if (rateNote) {
    const noteRow = tr1 + 2;
    ws1.mergeCells(noteRow, 1, noteRow, N1);
    Object.assign(ws1.getCell(noteRow,1), {
      value: rateNote,
      font:  { italic:true, size:10, color:{argb:'FF718096'}, name:'Microsoft JhengHei' },
      alignment: aLeft,
    });
    if (Object.keys(rateDetails).length) {
      const hdrRow = noteRow + 1;
      ['幣別','即期買入','即期賣出','平均匯率'].forEach((h, i) => {
        const c = ws1.getCell(hdrRow, i+1);
        c.value = h; c.font = { bold:true, color:{argb:'FF1A365D'}, name:'Microsoft JhengHei', size:10 };
        c.fill = fill(C.RATE); c.border = bThin(); c.alignment = aCenter;
      });
      Object.entries(rateDetails).forEach(([code, rd], di) => {
        const dr = hdrRow + 1 + di;
        [code, rd.buy, rd.sell, rd.avg].forEach((v, i) => {
          const c = ws1.getCell(dr, i+1);
          c.value = v; c.border = bThin(); c.font = fData();
          c.alignment = i === 0 ? aCenter : aRight;
        });
        ws1.getCell(dr,4).font = { ...fData(), bold:true };
      });
    }
  }

  // ── Sheet 2: 銀行借款 ──
  const ws2 = wb.addWorksheet('銀行借款');
  ws2.views = [{ showGridLines: false }];
  const N2 = 17;

  titleRows(ws2, N2);

  // 欄標題 Row 5–6（借款期間、財報表達分兩列）
  ['銀行別','放款別','放款帳號','借款期間','','幣別','回函原幣數','匯率','換算台幣數','財報表達與揭露(系統計算)','','','年利率','保證人','擔保品','擔保品或抵押','備註']
    .forEach((h, i) => {
      const c = ws2.getCell(5, i+1);
      const ci = i + 1;
      const isCalc = (ci >= 10 && ci <= 12);
      c.value = h; c.font = fHeader(); c.fill = fill(isCalc ? C.CALC : C.HEADER); c.border = bThin(); c.alignment = aWrap;
    });
  ws2.mergeCells(5, 4, 5, 5);   // 借款期間
  ws2.mergeCells(5, 10, 5, 12);  // 財報表達與揭露(系統計算)
  ['','','','放款日','到期日','','','','','短期借款','一年內到期長期借款','長期借款(超過一年)','','','','',''].forEach((h, i) => {
    const c = ws2.getCell(6, i+1);
    const ci = i + 1;
    const isCalc = (ci >= 10 && ci <= 12);
    c.value = h; c.font = fHeader(); c.fill = fill(isCalc ? C.CALC : C.HEADER); c.border = bThin(); c.alignment = aWrap;
  });
  // Row 5 其餘非合併欄跨列合併至 Row 6
  [1,2,3,6,7,8,9,13,14,15,16,17].forEach(ci => ws2.mergeCells(5, ci, 6, ci));
  ws2.getRow(5).height = 20;
  ws2.getRow(6).height = 32;
  [24,20,20,10,10,8,14,8,14,12,18,18,8,8,8,16,16].forEach((w, i) => { ws2.getColumn(i+1).width = w; });

  const loans = data.loans || [];
  const baseDate2 = data.base_date || '';
  const loanClassified2 = loans.map(l => classifyLoan(l, baseDate2));

  // Group loans by bank
  const loanGroups2 = [];
  let _curBk2 = null;
  loans.forEach((loan, i) => {
    if (loan.bank !== _curBk2) { loanGroups2.push({ bank: loan.bank, indices: [] }); _curBk2 = loan.bank; }
    loanGroups2[loanGroups2.length - 1].indices.push(i);
  });

  const loanRowMap = {};   // loanIdx → Excel row
  const loanSubRows = [];  // subtotal row numbers
  let ri2 = 7;
  loans.forEach((loan, idx) => {
    loanRowMap[idx] = ri2;
    styleDataRow(ws2, ri2, N2, [7,8,9,10,11,12], [4,5,6,13,14,15]);
    const lAmt = typeof loan.amount === 'number' ? loan.amount : 0;
    const { short, within1yr, beyond1yr } = loanClassified2[idx];

    ws2.getCell(ri2,1).value  = loan.bank;
    ws2.getCell(ri2,2).value  = loan.type;
    ws2.getCell(ri2,3).value  = loan.account;
    ws2.getCell(ri2,4).value  = formatRocDate(loan.loan_date);
    ws2.getCell(ri2,5).value  = formatRocDate(loan.due_date);
    ws2.getCell(ri2,6).value  = loan.currency;
    ws2.getCell(ri2,7).value  = lAmt;       ws2.getCell(ri2,7).numFmt = '#,##0';
    if (loan.fx_rate !== '') ws2.getCell(ri2,8).value = loan.fx_rate;
    ws2.getCell(ri2,9).value  = { formula: `ROUND(G${ri2}*H${ri2},0)` }; ws2.getCell(ri2,9).numFmt = '#,##0';
    ws2.getCell(ri2,10).value  = short;    ws2.getCell(ri2,10).numFmt  = '#,##0';
    ws2.getCell(ri2,11).value  = within1yr; ws2.getCell(ri2,11).numFmt  = '#,##0';
    ws2.getCell(ri2,12).value = beyond1yr; ws2.getCell(ri2,12).numFmt = '#,##0';
    ws2.getCell(ri2,13).value = loan.interest_rate;
    ws2.getCell(ri2,14).value = loan.guarantor;
    ws2.getCell(ri2,15).value = loan.collateral;
    ws2.getCell(ri2,16).value = loan.collateral_desc;
    ws2.getCell(ri2,17).value = loan.note || '';
    ri2++;

    // Bank subtotal row (only when multiple banks)
    if (loanGroups2.length > 1) {
      const grp = loanGroups2.find(g => g.indices[g.indices.length - 1] === idx);
      if (grp) {
        const firstRow = loanRowMap[grp.indices[0]];
        const lastRow  = loanRowMap[grp.indices[grp.indices.length - 1]];
        ws2.mergeCells(ri2, 1, ri2, 8);
        for (let ci = 1; ci <= N2; ci++) {
          const c = ws2.getCell(ri2, ci);
          c.fill = fill(C_SUB); c.border = bThin(); c.font = { ...fData(), bold: true };
        }
        ws2.getCell(ri2,1).value = `${grp.bank} 小計`; ws2.getCell(ri2,1).alignment = aLeft;
        ws2.getCell(ri2,9).value  = { formula: `SUM(I${firstRow}:I${lastRow})` };
        ws2.getCell(ri2,9).numFmt  = '#,##0'; ws2.getCell(ri2,9).alignment  = aRight;
        ws2.getCell(ri2,10).value = { formula: `SUM(J${firstRow}:J${lastRow})` };
        ws2.getCell(ri2,10).numFmt = '#,##0'; ws2.getCell(ri2,10).alignment = aRight;
        ws2.getCell(ri2,11).value = { formula: `SUM(K${firstRow}:K${lastRow})` };
        ws2.getCell(ri2,11).numFmt = '#,##0'; ws2.getCell(ri2,11).alignment = aRight;
        ws2.getCell(ri2,12).value = { formula: `SUM(L${firstRow}:L${lastRow})` };
        ws2.getCell(ri2,12).numFmt = '#,##0'; ws2.getCell(ri2,12).alignment = aRight;
        ws2.getRow(ri2).height = 18;
        loanSubRows.push(ri2);
        ri2++;
      }
    }
  });

  const tr2 = ri2;
  for (let ci = 1; ci <= N2; ci++) { const c = ws2.getCell(tr2,ci); c.fill=fill(C.TOTAL); c.border=bTotal(); c.font=fTotal(); }
  Object.assign(ws2.getCell(tr2,1), { value:'銀行借款合計', alignment:aLeft });
  // 合計公式：有小計就加小計，否則加全部資料列
  const _loanSumCols = [['I',9],['J',10],['K',11],['L',12]];
  _loanSumCols.forEach(([col, ci]) => {
    if (loanSubRows.length > 0) {
      ws2.getCell(tr2,ci).value = { formula: loanSubRows.map(r => `${col}${r}`).join('+') };
    } else if (loans.length > 0) {
      ws2.getCell(tr2,ci).value = { formula: `SUM(${col}${loanRowMap[0]}:${col}${loanRowMap[loans.length - 1]})` };
    } else {
      ws2.getCell(tr2,ci).value = 0;
    }
    Object.assign(ws2.getCell(tr2,ci), { numFmt:'#,##0', alignment:aRight });
  });
  ws2.getRow(tr2).height = 20;

  // 借款分類備註（檢查是否有長期借款分類值）
  let hasLongTermClass = false;
  loanClassified2.forEach(c => { if (c.within1yr > 0 || c.beyond1yr > 0) hasLongTermClass = true; });
  if (hasLongTermClass) {
    const noteRow2 = tr2 + 2;
    ws2.mergeCells(noteRow2, 1, noteRow2, N2);
    Object.assign(ws2.getCell(noteRow2, 1), {
      value: '＊「一年內到期長期借款」及「長期借款(超過一年)」係依各筆借款之到期日與查核基準日之剩餘期間月數比例，自換算台幣數估算分攤，如有其他更佳估計值(如銀行攤還表等)，應優先採用並予修正。',
      font:      { italic:true, size:10, color:{ argb:'FF718096' }, name:'Microsoft JhengHei' },
      alignment: { horizontal:'left', vertical:'middle', wrapText:true },
    });
    ws2.getRow(noteRow2).height = 32;
  }

  // 銀行借款 sheet 設為橫向列印
  ws2.pageSetup = Object.assign(ws2.pageSetup || {}, { orientation: 'landscape' });

  // ── Sheet 3: 其他項目（若有）──
  const otherSecs = data.other_sections || [];
  if (otherSecs.length) {
    const ws3 = wb.addWorksheet('其他項目');
    ws3.views = [{ showGridLines: false }];
    let cur = 1;
    for (const sec of otherSecs) {
      const allHdrs = ['銀行別', ...sec.headers];
      const nCols   = allHdrs.length;
      ws3.mergeCells(cur, 1, cur, nCols);
      Object.assign(ws3.getCell(cur,1), { value:sec.title, font:fTitle(12), fill:fill(C.TITLE), alignment:aLeft });
      ws3.getRow(cur).height = 22;
      cur++;
      allHdrs.forEach((h, i) => {
        const c = ws3.getCell(cur, i+1);
        c.value = h; c.font = fHeader(); c.fill = fill(C.HEADER); c.border = bThin(); c.alignment = aCenter;
      });
      ws3.getRow(cur).height = 22;
      cur++;
      for (const row of sec.rows) {
        const rowFill = fill(cur % 2 === 0 ? C.EVEN : C.ODD);
        const c0 = ws3.getCell(cur, 1);
        c0.value = sec.bank; c0.fill = rowFill; c0.border = bThin(); c0.font = fData(); c0.alignment = aCenter;
        row.forEach((v, i) => {
          const c = ws3.getCell(cur, i+2);
          c.value = v; c.fill = rowFill; c.border = bThin(); c.font = fData();
        });
        cur++;
      }
      cur += 2;
    }
  }

  const buffer = await wb.xlsx.writeBuffer();
  return new Blob([buffer], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

// ════════════════════════════════════════════════
// 清洗按鈕（純瀏覽器，不需後端）
// ════════════════════════════════════════════════
btnClean.addEventListener('click', async () => {
  if (uploadedFiles.length === 0) return;
  btnClean.disabled = true;
  statusEl.innerHTML = '<span class="loading"></span>清洗中...';
  statusEl.className = 'status';

  const errors  = [];
  const results = [];

  for (const file of uploadedFiles) {
    try {
      const ab     = await file.arrayBuffer();
      const result = parseConfirmation(ab, file.name);
      results.push(result);
    } catch (err) {
      errors.push(`${file.name}: ${err.message}`);
    }
  }

  if (results.length === 0) {
    statusEl.textContent = `清洗失敗：${errors.join('；')}`;
    statusEl.className   = 'status error';
    btnClean.disabled    = false;
    return;
  }

  try {
    cleanedData        = mergeAndDedup(results);
    cleanedData.errors = errors;

    let msg = `清洗完成！已處理 ${cleanedData.file_count} 個檔案，` +
              `存款 ${cleanedData.deposits.length} 筆、借款 ${cleanedData.loans.length} 筆`;
    if (errors.length > 0) {
      msg += `　錯誤：${errors.join('；')}`;
      statusEl.className = 'status error';
    } else {
      statusEl.className = 'status success';
    }
    statusEl.textContent = msg;

    renderPreview();
    previewSection.style.display = '';
    btnDownload.style.display    = '';

    // 若有外幣存款或借款，嘗試套用匯率
    const hasForeign = cleanedData.deposits.some(d => d.currency !== 'TWD')
                    || cleanedData.loans.some(l => l.currency !== 'TWD');
    if (hasForeign && cleanedData.base_date) {
      const baseYear = parseInt((cleanedData.base_date || '').split('/')[0]);
      if (baseYear === PREFETCH_CE_YEAR) {
        // 同年度：先等預取，預取失敗再即時查詢
        const statusSpan = document.getElementById('rateStatus');
        if (statusSpan) { statusSpan.style.color = '#718096'; statusSpan.textContent = '匯率載入中...'; }
        yearEndRatesPromise.then(cached => {
          if (cached) {
            applyRatesToUI(cached.rates, cached.dateUsed);
          } else {
            // 預取失敗，fallback 即時查詢
            handleFetchRates();
          }
        });
      }
      // 年度不同：匯率欄留空，使用者可手動點按鈕查詢
    }
  } catch (err) {
    statusEl.textContent = `清洗失敗：${err.message}`;
    statusEl.className   = 'status error';
  } finally {
    btnClean.disabled = false;
  }
});

// 預覽渲染

function renderPreview() {
  if (!cleanedData) return;
  renderDepositTable();

}

function renderOtherTable() {
  const sections = cleanedData.other_sections || [];
  const tabBtn   = document.getElementById('tab-btn-other');
  if (!sections.length) { tabBtn.style.display = 'none'; return; }
  tabBtn.style.display = '';

  let html = '';
  for (const sec of sections) {
    html += `<h4 style="margin:20px 0 8px;color:#2d3748">${sec.title}（${sec.bank}）</h4>`;
    html += `<table style="border-collapse:collapse;font-size:13px;width:auto"><thead><tr>`;
    html += `<th style="background:#4a5568;color:#fff;padding:6px 12px;border:1px solid #cbd5e0;min-width:90px;white-space:nowrap">銀行別</th>`;
    for (const h of sec.headers) {
      html += `<th style="background:#4a5568;color:#fff;padding:6px 12px;border:1px solid #cbd5e0">${h}</th>`;
    }
    html += `</tr></thead><tbody>`;
    for (const row of sec.rows) {
      html += `<tr><td style="padding:5px 12px;border:1px solid #e2e8f0;white-space:nowrap">${sec.bank}</td>`;
      row.forEach((v, i) => {
        const hdr   = sec.headers[i] || '';
        const isAmt = hdr.includes('金額') || hdr.includes('餘額');
        let display = v;
        if (isAmt && v !== '' && v !== '無') {
          const n = parseFloat(v);
          if (!isNaN(n)) display = formatNumber(Math.round(n));
        }
        html += `<td style="padding:5px 12px;border:1px solid #e2e8f0;${isAmt?'text-align:right':''}">${display}</td>`;
      });
      html += '</tr>';
    }
    html += '</tbody></table>';
  }
  document.getElementById('otherTable').innerHTML = html;
}

function renderDepositTable() {
  const deps = cleanedData.deposits;
  if (deps.length === 0) {
    document.getElementById('depositTable').innerHTML = '<div class="empty-state">無存款資料</div>';
    return;
  }

  const hasForeign = deps.some(d => d.currency !== 'TWD')
                  || cleanedData.loans.some(l => l.currency !== 'TWD');
  let html = '';
  if (hasForeign && cleanedData.base_date) {
    html += `<div style="margin-bottom:12px">
      <button class="btn btn-primary" id="btnFetchRates" style="padding:6px 20px;font-size:13px">
        自動查詢匯率（台灣銀行牌告）
      </button>
      <span id="rateStatus" style="margin-left:10px;font-size:13px"></span>
    </div>`;
  }

  html += `<table><thead><tr>
    <th rowspan="2">銀行別</th><th rowspan="2">存款別</th><th rowspan="2">帳號</th><th rowspan="2">幣別</th>
    <th rowspan="2">回函原幣數</th><th colspan="2" style="background:#4A5568;color:#fff">系統計算</th>
    <th rowspan="2">帳列數</th><th rowspan="2">限制情形</th><th rowspan="2">備註</th>
  </tr><tr>
    <th style="background:#4A5568;color:#fff">匯率</th><th style="background:#4A5568;color:#fff">換算台幣數</th>
  </tr></thead><tbody>`;

  let totalTwd = 0;

  // Group by bank
  _depBankGroups = [];
  let gi = 0;
  let curBank = null;
  deps.forEach((d, i) => {
    if (d.bank !== curBank) {
      _depBankGroups.push({ bank: d.bank, startIdx: i, indices: [] });
      curBank = d.bank;
      gi++;
    }
    _depBankGroups[_depBankGroups.length - 1].indices.push(i);
  });

  deps.forEach((d, i) => {
    const rate      = d.rate !== '' ? d.rate : '';
    const twdAmount = rate !== '' ? Math.round(d.amount * rate) : '';
    if (typeof twdAmount === 'number') totalTwd += twdAmount;

    const rateCell = d.currency === 'TWD'
      ? `<td class="num">1</td>`
      : `<td class="num"><input class="rate-input" type="number" step="0.001"
           value="${rate}" data-idx="${i}" data-field="rate"></td>`;

    html += `<tr>
      <td>${d.bank}</td><td>${d.type}</td><td>${d.account}</td>
      <td class="center">${d.currency}</td>
      <td class="num">${formatNumber(d.amount, d.currency !== 'TWD' ? 2 : undefined)}</td>
      ${rateCell}
      <td class="num" id="dep-twd-${i}">${twdAmount !== '' ? formatNumber(twdAmount) : ''}</td>
      <td class="center"></td>
      <td>${d.restriction || ''}</td>
      <td>${d.note || ''}</td>
    </tr>`;

    // Check if this is the last row of a bank group
    const grp = _depBankGroups.find(g => g.indices[g.indices.length - 1] === i);
    if (grp && _depBankGroups.length > 1) {
      const grpIdx = _depBankGroups.indexOf(grp);
      let grpTwd = 0;
      grp.indices.forEach(ii => {
        const r = deps[ii].rate !== '' ? deps[ii].rate : 0;
        if (r !== 0) grpTwd += Math.round(deps[ii].amount * r);
      });
      html += `<tr class="subtotal-row">
        <td colspan="6">${grp.bank} 小計</td>
        <td class="num" id="dep-bank-sub-${grpIdx}">${formatNumber(grpTwd)}</td>
        <td></td><td></td><td></td>
      </tr>`;
    }
  });

  html += `<tr class="total-row">
    <td>銀行存款合計</td><td></td><td></td><td></td><td></td><td></td>
    <td class="num" id="dep-total">${formatNumber(totalTwd)}</td>
    <td></td><td></td><td></td>
  </tr></tbody></table>`;

  html += `<div id="rateTableContainer"></div>`;
  document.getElementById('depositTable').innerHTML = html;

  const btnFetch = document.getElementById('btnFetchRates');
  if (btnFetch) btnFetch.addEventListener('click', handleFetchRates);

  document.querySelectorAll('.rate-input').forEach(input => {
    input.addEventListener('input', () => {
      const idx  = parseInt(input.dataset.idx);
      const rate = parseFloat(input.value) || 0;
      cleanedData.deposits[idx].rate = rate;
      const amt  = Math.round(cleanedData.deposits[idx].amount * rate);
      document.getElementById(`dep-twd-${idx}`).textContent = formatNumber(amt);
      recalcDepositTotal();
    });
  });
}

function recalcDepositTotal() {
  let total = 0;
  cleanedData.deposits.forEach(d => {
    const rate = d.rate !== '' ? Number(d.rate) : 0;
    total += Math.round(d.amount * rate);
  });
  document.getElementById('dep-total').textContent = formatNumber(total);

  // Update bank subtotals
  if (_depBankGroups.length > 1) {
    _depBankGroups.forEach((grp, gi) => {
      let grpTwd = 0;
      grp.indices.forEach(ii => {
        const r = cleanedData.deposits[ii].rate !== '' ? Number(cleanedData.deposits[ii].rate) : 0;
        grpTwd += Math.round(cleanedData.deposits[ii].amount * r);
      });
      const el = document.getElementById(`dep-bank-sub-${gi}`);
      if (el) el.textContent = formatNumber(grpTwd);
    });
  }
}

// ════════════════════════════════════════════════
// 借款分類：短期 / 一年內到期長借 / 長期(超過一年)
// ════════════════════════════════════════════════
function parseDateFromRoc(val) {
  if (val === null || val === undefined || val === '') return null;
  const n = typeof val === 'number' ? val : parseInt(val);
  if (isNaN(n) || n < 1000000) return null;
  const rocYear = Math.floor(n / 10000);
  const month   = Math.floor((n % 10000) / 100);
  const day     = n % 100;
  return new Date(rocYear + 1911, month - 1, day);
}

function monthsBetween(d1, d2) {
  return (d2.getFullYear() - d1.getFullYear()) * 12 + (d2.getMonth() - d1.getMonth());
}

function classifyLoan(loan, baseDate) {
  const origAmt = typeof loan.amount === 'number' ? loan.amount : 0;
  const fxRate = typeof loan.fx_rate === 'number' ? loan.fx_rate : 1;
  const amt = Math.round(origAmt * fxRate);
  const result = { short: 0, within1yr: 0, beyond1yr: 0 };
  if (amt === 0) return result;

  const typeStr     = (loan.type || '').toString();
  const isShortType = /短期|貼現|透支/.test(typeStr);

  const dueDate  = parseDateFromRoc(loan.due_date);
  const loanDate = parseDateFromRoc(loan.loan_date);

  let baseDt = null;
  if (baseDate) {
    const m = baseDate.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
    if (m) baseDt = new Date(parseInt(m[1]), parseInt(m[2]) - 1, parseInt(m[3]));
  }

  const periodMonths  = (loanDate && dueDate) ? monthsBetween(loanDate, dueDate) : null;
  const isShortPeriod = periodMonths !== null && periodMonths < 12;

  if (isShortType || isShortPeriod) {
    result.short = amt;
    return result;
  }

  if (!baseDt || !dueDate) {
    result.beyond1yr = amt;
    return result;
  }

  const remaining = monthsBetween(baseDt, dueDate);
  if (remaining <= 0) {
    result.short = amt;
  } else if (remaining < 12) {
    result.within1yr = amt;
  } else {
    result.within1yr = Math.round(amt * 12 / remaining);
    result.beyond1yr = amt - result.within1yr;
  }
  return result;
}

function renderLoanTable() {
  const loans = cleanedData.loans;
  if (loans.length === 0) {
    document.getElementById('loanTable').innerHTML = '<div class="empty-state">無借款資料</div>';
    return;
  }

  const baseDate = cleanedData.base_date || '';
  const classified = loans.map(l => classifyLoan(l, baseDate));

  // Group by bank
  const loanBankGroups = [];
  let curLoanBank = null;
  loans.forEach((l, i) => {
    if (l.bank !== curLoanBank) {
      loanBankGroups.push({ bank: l.bank, indices: [] });
      curLoanBank = l.bank;
    }
    loanBankGroups[loanBankGroups.length - 1].indices.push(i);
  });

  let html = `<div style="margin-bottom:8px">
    <span class="classify-toggle" id="loanClassifyToggle">＋ 顯示短期／長期分類欄</span>
  </div>`;

  html += `<table id="loanTableEl" class="classify-hidden"><thead><tr>
    <th style="min-width:90px" rowspan="2">銀行別</th><th style="min-width:90px" rowspan="2">放款別</th><th rowspan="2">放款帳號</th>
    <th rowspan="2">放款日</th><th rowspan="2">到期日</th><th rowspan="2">幣別</th>
    <th rowspan="2">回函原幣數</th><th rowspan="2">匯率</th><th rowspan="2">換算台幣數</th>
    <th class="classify-col" colspan="3" style="background:#4A5568;color:#fff">財報表達與揭露(系統計算)</th>
    <th rowspan="2">年利率</th><th rowspan="2">保證人</th>
    <th rowspan="2">擔保品</th><th rowspan="2">擔保品或抵押</th><th rowspan="2">備註</th>
  </tr><tr>
    <th class="classify-col" style="background:#4A5568;color:#fff">短期借款</th>
    <th class="classify-col" style="background:#4A5568;color:#fff">一年內到期長期借款</th>
    <th class="classify-col" style="background:#4A5568;color:#fff">長期借款(超過一年)</th>
  </tr></thead><tbody>`;

  let totalTwd = 0, totalShort = 0, totalWithin = 0, totalBeyond = 0;

  loans.forEach((l, i) => {
    const amt = typeof l.amount === 'number' ? l.amount : 0;
    const fxRate = typeof l.fx_rate === 'number' ? l.fx_rate : 1;
    const twdAmt = Math.round(amt * fxRate);
    totalTwd += twdAmt;
    const { short, within1yr, beyond1yr } = classified[i];
    totalShort += short; totalWithin += within1yr; totalBeyond += beyond1yr;

    html += `<tr>
      <td>${l.bank}</td><td>${l.type}</td><td>${l.account}</td>
      <td class="center">${formatRocDate(l.loan_date)}</td><td class="center">${formatRocDate(l.due_date)}</td>
      <td class="center">${l.currency}</td>
      <td class="num">${formatNumber(amt, l.currency !== 'TWD' ? 2 : undefined)}</td>
      <td class="num">${l.fx_rate !== '' ? l.fx_rate : ''}</td>
      <td class="num">${formatNumber(twdAmt)}</td>
      <td class="num classify-col">${formatNumber(short)}</td>
      <td class="num classify-col">${formatNumber(within1yr)}</td>
      <td class="num classify-col">${formatNumber(beyond1yr)}</td>
      <td class="center">${l.interest_rate}</td><td class="center">${l.guarantor}</td>
      <td class="center">${l.collateral}</td>
      <td>${l.collateral_desc}</td><td>${l.note || ''}</td>
    </tr>`;

    const grp = loanBankGroups.find(g => g.indices[g.indices.length - 1] === i);
    if (grp && loanBankGroups.length > 1) {
      let grpTwd = 0, grpShort = 0, grpWithin = 0, grpBeyond = 0;
      grp.indices.forEach(ii => {
        const a = typeof loans[ii].amount === 'number' ? loans[ii].amount : 0;
        const r = typeof loans[ii].fx_rate === 'number' ? loans[ii].fx_rate : 1;
        grpTwd    += Math.round(a * r);
        grpShort  += classified[ii].short;
        grpWithin += classified[ii].within1yr;
        grpBeyond += classified[ii].beyond1yr;
      });
      html += `<tr class="subtotal-row">
        <td colspan="8">${grp.bank} 小計</td>
        <td class="num">${formatNumber(grpTwd)}</td>
        <td class="num classify-col">${formatNumber(grpShort)}</td>
        <td class="num classify-col">${formatNumber(grpWithin)}</td>
        <td class="num classify-col">${formatNumber(grpBeyond)}</td>
        <td></td><td></td><td></td><td></td><td></td>
      </tr>`;
    }
  });

  html += `<tr class="total-row">
    <td>銀行借款合計</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td>
    <td class="num">${formatNumber(totalTwd)}</td>
    <td class="num classify-col">${formatNumber(totalShort)}</td>
    <td class="num classify-col">${formatNumber(totalWithin)}</td>
    <td class="num classify-col">${formatNumber(totalBeyond)}</td>
    <td></td><td></td><td></td><td></td><td></td>
  </tr></tbody></table>`;

  if (totalWithin > 0 || totalBeyond > 0) {
    html += `<div style="margin-top:10px;font-size:12px;color:#718096;font-style:italic;line-height:1.6">
      ＊「一年內到期長期借款」及「長期借款(超過一年)」係依各筆借款之到期日與查核基準日之剩餘期間月數比例，自換算台幣數估算分攤，如有其他更佳估計值(如銀行攤還表等)，應優先採用並予修正。
    </div>`;
  }

  document.getElementById('loanTable').innerHTML = html;

  const toggleBtn = document.getElementById('loanClassifyToggle');
  const tableEl   = document.getElementById('loanTableEl');
  toggleBtn.addEventListener('click', () => {
    const isHidden = tableEl.classList.contains('classify-hidden');
    tableEl.classList.toggle('classify-hidden');
    toggleBtn.textContent = isHidden ? '－ 隱藏短期／長期分類欄' : '＋ 顯示短期／長期分類欄';
  });
}

// 下載按鈕（純瀏覽器，不需後端）

btnDownload.addEventListener('click', async () => {
  if (!cleanedData) return;
  btnDownload.disabled = true;
  try {
    const blob         = await generateXlsx(cleanedData);
    const url          = URL.createObjectURL(blob);
    const a            = document.createElement('a');
    const companyName  = cleanedData.company_name || '清洗結果';
    a.href             = url;
    a.download         = `${companyName}_銀行函證清洗.xlsx`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (err) {
    statusEl.textContent = `下載失敗：${err.message}`;
    statusEl.className   = 'status error';
  } finally {
    btnDownload.disabled = false;
  }
});
